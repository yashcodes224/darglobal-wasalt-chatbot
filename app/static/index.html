<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DarGlobal &amp; Wasalt Assistant</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1c1c1c; --muted:#6b6b6b; --accent:#0f3d3e; --user:#0f3d3e; --userink:#fff; --line:#e3e0d8; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --card:#1e1e1e; --ink:#eee; --muted:#9a9a9a; --accent:#6fc3c4; --user:#2c5f60; --userink:#fff; --line:#333; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--ink); height:100dvh; display:flex; flex-direction:column; }
  header { padding:14px 18px; border-bottom:1px solid var(--line); background:var(--card); }
  header h1 { font-size:17px; margin:0; }
  header p { margin:2px 0 0; font-size:12.5px; color:var(--muted); }
  #log { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px; max-width:820px; width:100%; margin:0 auto; }
  .msg { padding:10px 14px; border-radius:14px; max-width:88%; line-height:1.5; white-space:pre-wrap; word-wrap:break-word; font-size:15px; }
  .bot { background:var(--card); border:1px solid var(--line); align-self:flex-start; }
  .me { background:var(--user); color:var(--userink); align-self:flex-end; }
  .src { margin-top:8px; font-size:12.5px; color:var(--muted); white-space:normal; }
  .src a { color:var(--accent); margin-right:10px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:1px solid var(--line); background:var(--card); color:var(--ink); padding:7px 12px; border-radius:999px; font-size:13px; cursor:pointer; }
  .chip:hover { border-color:var(--accent); }
  form { display:flex; gap:8px; padding:12px 18px 16px; max-width:820px; width:100%; margin:0 auto; }
  input { flex:1; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:15px; }
  button.send { padding:0 18px; border:0; border-radius:12px; background:var(--accent); color:#fff; font-size:15px; cursor:pointer; }
  button.send:disabled { opacity:.5; cursor:default; }
  .foot { text-align:center; font-size:11.5px; color:var(--muted); padding:0 18px 10px; }
</style>
</head>
<body>
<header>
  <h1>DarGlobal &amp; Wasalt Assistant</h1>
  <p>Ask about DarGlobal projects, partners and news, or how Wasalt works. Answers come from a curated dataset of their public pages.</p>
</header>
<div id="log"></div>
<form id="f" autocomplete="off">
  <input id="q" placeholder="e.g. Which DarGlobal projects are in Oman?" maxlength="1000" autofocus>
  <button class="send" id="b">Send</button>
</form>
<div class="foot">Informational only. Not financial advice. Data collected 19 Nov 2026 and may be out of date.</div>
<script>
const log = document.getElementById('log'), f = document.getElementById('f'), q = document.getElementById('q'), b = document.getElementById('b');
const history = [];
function add(cls, text) { const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; }
const intro = add('bot', 'Hello! I can answer questions about DarGlobal (projects, locations, brand partners, press) and Wasalt (features, property types, how it works). Try one of these:');
const chips = document.createElement('div'); chips.className = 'chips';
["Which DarGlobal projects are in Oman?", "Who are DarGlobal's brand partners?", "What is Wasalt and who owns it?", "Tell me about Trump Mansions in Riyadh", "What did DarGlobal announce in November 2026?"].forEach(t => {
  const c = document.createElement('button'); c.type = 'button'; c.className = 'chip'; c.textContent = t; c.onclick = () => { q.value = t; f.requestSubmit(); }; chips.appendChild(c);
});
log.appendChild(chips);
f.addEventListener('submit', async e => {
  e.preventDefault();
  const text = q.value.trim(); if (!text) return;
  q.value = ''; b.disabled = true; chips.remove();
  add('me', text);
  const wait = add('bot', 'Thinking…');
  try {
    const r = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text, history: history.slice(-6) }) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || ('Error ' + r.status));
    wait.textContent = data.answer;
    if (data.sources && data.sources.length) {
      const s = document.createElement('div'); s.className = 'src'; s.append('Sources: ');
      data.sources.forEach(x => { const a = document.createElement('a'); a.href = x.url; a.target = '_blank'; a.rel = 'noopener'; a.textContent = x.title; s.appendChild(a); });
      wait.appendChild(s);
    }
    history.push({ role: 'user', content: text }, { role: 'assistant', content: data.answer });
  } catch (err) { wait.textContent = 'Sorry, something went wrong: ' + err.message; }
  b.disabled = false; q.focus(); log.scrollTop = log.scrollHeight;
});
</script>
</body>
</html>
